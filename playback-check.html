<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OlyLINK 재생 연결 점검</title><style>body{font:16px system-ui;margin:20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}section{border:1px solid #ddd;padding:12px}iframe{width:100%;height:260px}button{padding:10px;margin:4px}output{display:block}#d .os-title{font-size:18px}</style><h1>재생 연결 점검</h1><p>공식 YouTube API 예제 영상만 사용하는 연결 점검입니다.</p><main><section><h2>A 일반 임베드</h2><iframe id="a" title="일반 임베드" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><output id="a-state">준비 중</output></section><section><h2>B 개인정보 보호 임베드</h2><iframe id="b" title="개인정보 보호 임베드" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><output id="b-state">준비 중</output></section><section><h2>C API 생성 일반 임베드</h2><div id="c"></div><output id="c-state">준비 중</output></section><section><h2>D 현재 자막 모듈</h2><div id="d"></div><output id="d-state">준비 중</output></section></main><script type="module">
const vid='M7lc1UVf-VE',base='?enablejsapi=1&playsinline=1&origin='+encodeURIComponent(location.origin);
for(const id of ['a','b'])document.getElementById(id).src='https://www.youtube'+(id==='b'?'-nocookie':'')+'.com/embed/'+vid+base;
function events(id){return{onReady:e=>{const o=document.getElementById(id+'-state');o.textContent='준비 완료';for(const [name,method]of [['재생','playVideo'],['일시정지','pauseVideo']]){const b=document.createElement('button');b.textContent=id+' '+name;b.onclick=()=>e.target[method]();o.after(b);}setInterval(()=>{o.textContent='상태 '+e.target.getPlayerState()+' · '+e.target.getCurrentTime().toFixed(1)+'초';},500);},onError:e=>document.getElementById(id+'-state').textContent='오류 '+e.data};}
window.onYouTubeIframeAPIReady=async()=>{for(const id of ['a','b','c']){const options={events:events(id)};if(id==='b')options.host='https://www.youtube-nocookie.com';if(id==='c')Object.assign(options,{videoId:vid,width:'100%',height:260,playerVars:{origin:location.origin,playsinline:1}});new YT.Player(id,options);}const {mountSubtitlePlayer}=await import('./subtitle-player.js?v=20261022-youtube-create');mountSubtitlePlayer(document.getElementById('d'),{caseId:'OLY-000',title:'공식 예제 영상 연결 확인',platform:'YouTube',watchUrl:'https://www.youtube.com/watch?v='+vid,embedUrl:'https://www.youtube.com/embed/'+vid,start:0,end:45,cues:[{id:1,start:0,end:15,ko:'재생 점검용 한국어 문구 1',original:''},{id:2,start:15,end:30,ko:'재생 점검용 한국어 문구 2',original:''},{id:3,start:30,end:45,ko:'재생 점검용 한국어 문구 3',original:''}]},{onReady:()=>document.getElementById('d-state').textContent='준비 완료',onError:e=>document.getElementById('d-state').textContent=e.message});};
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
</script></html>
