<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="application-name" content="Olybiz"><meta name="apple-mobile-web-app-title" content="Olybiz"><title>Olybiz</title></head><body><div id="ulilife-preview">

      <nav class="ul-app-nav" aria-label="앱 메뉴">
        <button type="button" data-section="library" aria-pressed="true">자료실</button>
        <button type="button" data-section="meetings" id="ul-meetings-nav" aria-pressed="false">구글 미팅방</button><button type="button" data-section="experiences" aria-pressed="false" aria-label="글로벌 체험 사례"><span>글로벌</span><br><span>체험 사례</span></button>
      <button type="button" data-section="admin" id="ul-admin-nav" hidden aria-pressed="false">자료 관리</button><button type="button" data-section="meeting-admin" id="ul-meeting-admin-nav" hidden aria-pressed="false" aria-label="구글 미팅 관리"><span>구글 미팅</span><br><span>관리</span></button></nav>
      <main><label><span>언어</span><select id="ul-locale"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select></label>
        <div data-panel="library">
          <div class="ul-kicker">배우고, 이해하고, 함께 성장하기</div>
          <h2>자료실</h2>
          <label class="ul-search"><i data-lucide="search" aria-hidden="true"></i><input id="ul-search" type="search" aria-label="제품명 또는 강의 제목 검색" placeholder="제품명 또는 강의 제목 검색"></label>
          
          <div class="ul-listhead"><span id="ul-count" aria-live="polite"></span></div>
          <div id="ul-list"></div>
          <section id="ul-detail" hidden aria-label="자료 상세"></section>
        </div>
        <div data-panel="meetings" hidden>
          <div class="ul-kicker">함께 배우는 온라인 교육</div>
          <h2>구글 미팅방</h2>
          <div id="ul-meetings" aria-live="polite"></div>
        </div>
        <div data-panel="experiences" hidden>
 <h2>글로벌 체험 사례</h2><div id="ul-experience-categories" class="ul-category-filter" role="group" aria-label="사례 분류"></div>
 <label><span>사례 검색</span><input id="ul-experience-search" type="search" placeholder="제목·국가·요약 검색"></label>
 <div class="ul-filters"><label><span>국가</span><select id="ul-experience-country"><option value="">전체 국가</option></select></label><label><span>원문 언어</span><select id="ul-experience-language"><option value="">전체 언어</option></select></label></div>
 <div id="ul-experience-list" aria-live="polite"></div>
 </div><div data-panel="auth" hidden>
 <h2 id="ul-auth-title">관리자 로그인</h2>
 <p id="ul-auth-description" class="ul-sub"></p>

 <button type="submit" class="ul-primary" id="ul-auth-submit">로그인</button></form>
 <div id="ul-auth-notice" role="alert"></div></div>
 <div data-panel="admin" hidden>
          <div class="ul-kicker">seean 전용</div><h2>자료 관리</h2><p class="ul-sub">자료를 등록하고 내용을 수정합니다.</p><button id="ul-import-local" type="button" hidden>기존 자료·미팅 가져오기</button><p id="ul-import-notice" role="status"></p>

            <label>자료 설명<textarea name="description" rows="2" placeholder="어떤 내용을 담은 자료인가요?"></textarea></label>
            <label>출처·근거 범위<textarea name="source" rows="2" placeholder="논문 출처와 설명 범위를 입력하세요."></textarea></label>
            <label>자료 파일<input name="file" type="file" accept=".pdf,application/pdf"></label>
            <div id="ul-file-label" class="ul-sub">PDF 최대 15MB · 이 컴퓨터에 저장합니다.</div>
            <div class="ul-actions"><button class="ul-primary" type="submit" id="ul-save">등록하기</button><button type="button" id="ul-cancel" hidden>수정 취소</button></div>

          <div id="ul-notice" role="status" aria-live="polite"></div>
          <h3>등록된 자료</h3><div id="ul-admin-list"></div>
        </div>

            <label>모임 제목<input name="title" required maxlength="200" placeholder="예: 비즈니스 플랜 설명회"></label>
            <label>날짜·시간 (한국 기준)<input name="starts" type="datetime-local" required></label>
            <label>진행 언어<select name="language"><option value="한국어">한국어</option><option value="English">English</option><option value="日本語">日本語</option><option value="中文">中文</option></select></label>
            <label>구글 미트 참여 링크<input name="link" type="text" inputmode="url" autocapitalize="none" spellcheck="false" maxlength="500" placeholder="meet.google.com/abc-defg-hij"></label>

            <p class="ul-sub">링크가 없으면 비워두세요. 나중에 수정할 수 있습니다.</p>
            <div class="ul-actions"><button type="submit" class="ul-primary" id="ul-meeting-save">등록하기</button><button type="button" id="ul-meeting-cancel" hidden>수정 취소</button></div>
          </form>
          <div id="ul-meeting-notice" role="status" aria-live="polite"></div>
          <h3>등록된 미팅</h3><div id="ul-meeting-admin-list"></div>
        </div>
      </main>
      <footer hidden><button id="ul-login" type="button" hidden>관리자 로그인</button><button id="ul-logout" type="button" hidden>로그아웃</button></footer>
    </section>
  </div>
</div>
<style>
#ulilife-preview {padding:20px 0;color-scheme:light;font-family:system-ui,'Malgun Gothic',sans-serif;--ul-bg:#a9bea2;--ul-paper:#f8fbf5;--ul-text:#24382a;--ul-muted:#4b6050;--ul-line:#c5d3bf;--ul-green:#49674e;--ul-on:#ffffff;--ul-soft:#dce8d5;--ul-orange:#f4bf7b;--ul-orange-ink:#3b2b17;--ul-orange-soft:#fff0db;--ul-orange-text:#775022;--ul-radius:18px}

#ulilife-preview [hidden] {display:none!important}
#ulilife-preview .ul-stage {max-width:430px;margin:0 auto;padding:0 12px}
#ulilife-preview .ul-switch {display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
#ulilife-preview button {font:inherit;cursor:inherit;min-height:44px;border:1px solid var(--ul-line);border-radius:12px;padding:10px 14px;background:var(--ul-paper);color:var(--ul-text)}
#ulilife-preview .ul-switch button {flex:1}
#ulilife-preview .ul-app-nav {display:flex;gap:8px;padding:12px 18px;background:var(--ul-paper);border-bottom:1px solid var(--ul-line)}
#ulilife-preview .ul-app-nav button {flex:1;min-width:0;font-size:14px}
#ulilife-preview .ul-app-nav [aria-pressed=true] {background:var(--ul-orange);color:var(--ul-orange-ink);border-color:var(--ul-orange)}
#ulilife-preview button:disabled {opacity:.65;cursor:default}
#ulilife-preview .ul-meeting {margin-top:18px}
#ulilife-preview .ul-switch [aria-pressed=true],#ulilife-preview .ul-primary {background:var(--ul-orange);color:var(--ul-orange-ink);border-color:var(--ul-orange)}
#ulilife-preview .ul-phone {background:var(--ul-bg);color:var(--ul-text);border:1px solid var(--ul-line);border-radius:var(--ul-radius);overflow:hidden}
#ulilife-preview header {padding:22px 20px 18px;border-bottom:1px solid var(--ul-line);background:var(--ul-paper)}
#ulilife-preview .ul-logo {display:flex;align-items:center;justify-content:center;width:100%;height:60px;padding:8px 10px;margin:0;background:#8da68b;border-radius:12px}
#ulilife-preview .ul-logo img {display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
#ulilife-preview .ul-brand {margin-bottom:0;background:var(--ul-orange)}
#ulilife-preview .ul-wordmark {display:inline-flex;align-items:center;justify-content:center;flex:1;height:28px;border:1.5px solid currentColor;border-radius:999px;font-size:22px;font-weight:600;line-height:1;letter-spacing:-.6px;padding:0 7px;}
#ulilife-preview .ul-owner {margin-top:6px;font-size:12px;color:var(--ul-muted)}
#ulilife-preview main {padding:22px 18px}
#ulilife-preview h2 {font-size:26px;margin:7px 0 6px;letter-spacing:-1px}
#ulilife-preview h3 {font-size:16px;margin:0 0 16px}
#ulilife-preview .ul-kicker {font-size:12px;color:var(--ul-green)}
#ulilife-preview .ul-sub {font-size:12px;color:var(--ul-muted);margin:0 0 18px;line-height:1.6}
#ulilife-preview label {display:block;font-size:12px;color:var(--ul-muted);margin-bottom:14px}
#ulilife-preview input,#ulilife-preview select,#ulilife-preview textarea {display:block;width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ul-text);background:var(--ul-paper);border:1px solid var(--ul-line);padding:12px;border-radius:10px;margin-top:6px}
#ulilife-preview textarea {resize:vertical}
#ulilife-preview .ul-search {position:relative;margin-top:22px}

#ulilife-preview .ul-search input {padding-left:40px;font-size:14px;min-height:48px}
#ulilife-preview .ul-filters {display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ulilife-preview .ul-listhead {display:flex;justify-content:space-between;font-size:12px;color:var(--ul-muted);margin:10px 0 14px}

#ulilife-preview .ul-category-filter {display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}

#ulilife-preview .ul-category-filter [aria-pressed="true"] {background:var(--ul-orange);border-color:var(--ul-orange);color:var(--ul-orange-ink);}
#ulilife-preview .ul-case-summary {font-size:14px;line-height:1.75;white-space:pre-line;overflow-wrap:anywhere;}

#ulilife-preview .ul-admin-note {padding:10px 12px;background:var(--ul-soft);font-size:12px;border-radius:10px;margin-bottom:18px}

#ulilife-preview #ul-detail {border-top:1px solid var(--ul-line);padding-top:20px;margin-top:24px;overflow-wrap:anywhere}

#ulilife-preview footer {display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:16px 18px;background:var(--ul-paper);border-top:1px solid var(--ul-line);font-size:11px;color:var(--ul-muted)}
#ulilife-preview .ul-vector-mark {display:inline-block;width:22px;height:22px;flex:0 0 22px;background-color:var(--ul-orange);mask-image:url("./mark.svg");mask-size:contain;mask-repeat:no-repeat;mask-position:center;}
#ulilife-preview .ul-brand-grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:12px;}
#ulilife-preview .ul-brand-group {min-width:0;}
#ulilife-preview .ul-brand-caption {display:flex;flex-direction:column;justify-content:center;min-height:44px;margin-top:8px;text-align:center;font-size:12px;font-weight:600;line-height:1.5;letter-spacing:.2px;color:var(--ul-muted);}

#ulilife-preview .ul-direct-inquiry {display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:8px;font-size:13px;font-weight:600;padding:10px 6px;}
#ulilife-preview #ul-inquiry-panel {padding:16px;background:var(--ul-soft);border-radius:12px;margin-bottom:16px;}
#ulilife-preview #ul-inquiry-panel p {font-size:13px;line-height:1.6;}
#ulilife-preview #ul-inquiry-panel button {width:100%;}
#ulilife-preview .ul-kakao-link {display:block;padding:12px 14px;text-align:center;text-decoration:none;min-height:44px;border-radius:12px;background:var(--ul-orange);color:var(--ul-orange-ink);font-size:14px;}
#ulilife-preview .ul-kakao-qr {display:block;width:min(220px,100%);height:auto;margin:18px auto;image-rendering:crisp-edges;}
#ulilife-preview footer button {padding:4px 8px;font-size:12px;min-height:36px;}
#ulilife-preview .ul-app-nav {flex-wrap:wrap;}
#ulilife-preview .ul-app-nav button {flex:1 1 calc((100% - 16px)/3);min-width:0;padding:10px 6px;font-size:13px;line-height:1.4;}
#ulilife-preview .ul-auth-error {color:#8c2525;}
#ulilife-preview input:disabled {opacity:.6;}
</style>
